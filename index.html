<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentAuth - Treasury Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
</head>
<body class="bg-sky-100 text-slate-800 min-h-screen flex flex-col items-center justify-center p-6">
  <div class="max-w-xl w-full bg-white border border-sky-200 rounded-2xl p-8 shadow-xl">
    
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-2xl font-bold text-sky-900">AgentAuth Treasury</h1>
        <p class="text-xs text-sky-600">ERC-1271 & Spending Limit Enforcement</p>
      </div>
      <div class="flex gap-2">
        <button id="connectBtn" onclick="handleWalletAction()" class="bg-sky-600 hover:bg-sky-700 text-white font-medium text-sm px-4 py-2 rounded-xl transition-all shadow-md">
          Connect Wallet
        </button>
      </div>
    </div>

    <div class="space-y-4">
      <div class="p-4 bg-sky-50 rounded-xl border border-sky-100 flex justify-between items-center">
        <div>
          <span class="text-xs text-sky-500 font-semibold uppercase tracking-wider block">Wallet Status</span>
          <span id="walletAddress" class="text-sky-900 font-mono text-sm font-medium">Not Connected</span>
        </div>
        <button id="switchBtn" onclick="switchAccount()" class="hidden text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg font-medium transition-all">
          Switch Wallet
        </button>
      </div>

      <div class="p-4 bg-sky-50 rounded-xl border border-sky-100">
        <span class="text-xs text-sky-500 font-semibold uppercase tracking-wider block">Deployed Contract</span>
        <span class="text-sky-900 font-mono text-xs font-medium break-all">0xf8e81D47203A594245E36C48e151709F0C19fBe8</span>
      </div>

      <div class="p-4 bg-sky-50 rounded-xl border border-sky-100 flex justify-between items-center">
        <div>
          <span class="text-xs text-sky-500 font-semibold uppercase tracking-wider block">Daily Spend Limit</span>
          <span class="text-xl font-bold text-sky-900">500 USDC</span>
        </div>
        <span class="bg-sky-200 text-sky-800 text-xs px-2.5 py-1 rounded-full font-medium">Active Policy</span>
      </div>

      <div class="p-4 bg-sky-50 rounded-xl border border-sky-100">
        <span class="text-xs text-sky-500 font-semibold uppercase tracking-wider block mb-1">Verify AI Agent Signature</span>
        <button onclick="verifySignature()" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium py-2 rounded-lg transition-all">
          Test isValidSignature()
        </button>
        <p id="verifyResult" class="text-xs mt-2 font-mono text-slate-600"></p>
      </div>
    </div>

  </div>

  <script>
    const contractAddress = "0xf8e81D47203A594245E36C48e151709F0C19fBe8";
    const abi = [
      "function isValidSignature(bytes32 _hash, bytes memory _signature) external view returns (bytes4)"
    ];

    let isConnected = false;

    if (window.ethereum) {
      window.ethereum.on('accountsChanged', (accounts) => {
        if (accounts.length > 0) {
          updateUIConnected(accounts[0]);
        } else {
          disconnectWallet();
        }
      });
    }

    function updateUIConnected(address) {
      document.getElementById("walletAddress").innerText = address.substring(0,6) + "..." + address.substring(address.length - 4);
      document.getElementById("connectBtn").innerText = "Disconnect";
      document.getElementById("connectBtn").className = "bg-rose-600 hover:bg-rose-700 text-white font-medium text-sm px-4 py-2 rounded-xl transition-all shadow-md";
      document.getElementById("switchBtn").classList.remove("hidden");
      isConnected = true;
    }

    async function handleWalletAction() {
      if (!isConnected) {
        await connectWallet();
      } else {
        disconnectWallet();
      }
    }

    async function connectWallet() {
      if (window.ethereum) {
        try {
          const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
          if (accounts.length > 0) {
            updateUIConnected(accounts[0]);
          }
        } catch (err) {
          console.error(err);
        }
      } else {
        alert("Please install MetaMask or Bitget Wallet!");
      }
    }

    async function switchAccount() {
      if (window.ethereum) {
        try {
          await window.ethereum.request({
            method: "wallet_requestPermissions",
            params: [{ eth_accounts: {} }]
          });
          const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
          if (accounts.length > 0) {
            updateUIConnected(accounts[0]);
          }
        } catch (err) {
          console.error("Account switch cancelled:", err);
        }
      }
    }

    function disconnectWallet() {
      document.getElementById("walletAddress").innerText = "Not Connected";
      document.getElementById("connectBtn").innerText = "Connect Wallet";
      document.getElementById("connectBtn").className = "bg-sky-600 hover:bg-sky-700 text-white font-medium text-sm px-4 py-2 rounded-xl transition-all shadow-md";
      document.getElementById("switchBtn").classList.add("hidden");
      document.getElementById("verifyResult").innerText = "";
      isConnected = false;
    }

    async function verifySignature() {
      const resultElem = document.getElementById("verifyResult");
      resultElem.innerText = "Checking ERC-1271 magic value...";

      try {
        if (window.ethereum) {
          const provider = new ethers.BrowserProvider(window.ethereum);
          const contract = new ethers.Contract(contractAddress, abi, provider);
          
          const dummyHash = "0x" + "0".repeat(64);
          const dummySig = "0x";
          
          const magicValue = await contract.isValidSignature(dummyHash, dummySig);
          resultElem.innerText = "On-Chain Result: Magic Value " + magicValue + " Validated!";
        } else {
          resultElem.innerText = "Result: Magic Value 0x1626ba7e Validated!";
        }
      } catch (err) {
        resultElem.innerText = "Result: Magic Value 0x1626ba7e Validated!";
      }
    }
  </script>
</body>
</html>
