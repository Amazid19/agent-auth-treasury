<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentAuth - Treasury Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-6">
  <div class="max-w-xl w-full bg-slate-800 border border-slate-700 rounded-xl p-8 shadow-2xl">
    <h1 class="text-3xl font-bold text-indigo-400 mb-2">AgentAuth Treasury Manager</h1>
    <p class="text-slate-400 mb-6">ERC-1271 Signature & Spending Limit Policy Enforcement</p>

    <div class="space-y-4">
      <div class="p-4 bg-slate-900 rounded-lg border border-slate-700">
        <span class="text-xs text-slate-500 uppercase tracking-wider block">Contract Status</span>
        <span class="text-green-400 font-mono font-medium">Active (ERC-1271 Standard)</span>
      </div>

      <div class="p-4 bg-slate-900 rounded-lg border border-slate-700">
        <span class="text-xs text-slate-500 uppercase tracking-wider block">Daily Spend Limit</span>
        <span class="text-xl font-bold text-slate-200">500 USDC</span>
      </div>

      <div class="p-4 bg-slate-900 rounded-lg border border-slate-700">
        <span class="text-xs text-slate-500 uppercase tracking-wider block">AI Agent Auth</span>
        <span class="text-indigo-300 font-mono text-sm">Off-chain Signature Verification Ready</span>
      </div>
    </div>
  </div>
</body>
</html>
